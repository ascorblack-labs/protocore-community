name: Publish

# Publishing uses PyPI Trusted Publishing (OIDC), so this repository holds no
# PyPI token — there is no long-lived secret to leak or rotate. PyPI verifies
# the workflow's identity directly.
#
# One-time setup on PyPI, under Your projects → Publishing → Add a pending
# publisher:
#
#   PyPI project name : protocore
#   Owner             : ascorblack-labs
#   Repository name   : protocore-community
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# After that, publishing a GitHub Release uploads the matching version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata renders
        run: uvx twine check dist/*

      - name: Refuse to publish a version the tag does not name
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/protocore-(.*)\.tar\.gz|\1|')
          if [ "$tag" != "$built" ]; then
            echo "::error::release tag is '$tag' but the build produced '$built'."
            echo "PyPI never lets a version be re-used, so this stops here."
            exit 1
          fi
          echo "tag and built version agree: $built"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/protocore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Upload to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/protocore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      # Skip a file already on the index instead of failing. The version
      # guard in the build job is what catches a genuine mistake; this only
      # keeps a re-run, or a release cut for a version published by hand,
      # from turning red over work that is already done.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
